name: Backend health check

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: backend-health
  cancel-in-progress: false

jobs:
  health:
    if: ${{ vars.RENDER_HEALTH_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      HEALTH_URL: ${{ vars.RENDER_HEALTH_URL }}
    steps:
      - name: Check backend and database
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --connect-timeout 15 --max-time 90 \
            --retry 1 --retry-delay 10 --retry-max-time 180 \
            "$HEALTH_URL" --output /tmp/classsense-health.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('/tmp/classsense-health.json').read_text())
          if result.get('status') != 'healthy' or result.get('database') != 'connected':
              raise SystemExit('Backend health check failed.')
          print('ClassSense backend and database are healthy.')
          PY
